name: nyxd
description: A private, offline-first diary for Android.
publish_to: 'none'
version: 0.1.0+4

environment:
  sdk: ^3.12.2

dependencies:
  cryptography: 2.9.0
  file_selector: 1.1.0
  flutter:
    sdk: flutter
  flutter_file_saver: 0.10.0
  path_provider: 2.1.5
  shared_preferences: 2.5.3
  sqlite3: 3.5.1
  unorm_dart: 0.3.2

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - LOGO_BRAND/brand-mark-metallic-1024.png

hooks:
  user_defines:
    sqlite3:
      source: sqlcipher
